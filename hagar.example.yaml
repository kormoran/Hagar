# Hagar example configuration.
#
# Copy this file to hagar.yaml and adjust the paths for your machine:
#
#   cp hagar.example.yaml hagar.yaml
#   mkdir -p vault logs
#   hagar --config hagar.yaml
#
# hagar.yaml is intentionally ignored by git: it contains local paths.

model:
  # provider: ollama | lmstudio | deepseek | openai | chatgpt | claude | gemini
  # LM Studio:  provider: lmstudio, host: http://localhost:1234/v1
  # OpenAI:     provider: openai,   name: gpt-4.1, api_key_env: OPENAI_API_KEY
  provider: ollama
  host: http://localhost:11434
  name: llama3.1:latest
  native_tools: true
  # timeout: 120
  # max_tokens: 1024
  # api_key_env: DEEPSEEK_API_KEY

audit:
  enabled: true
  path: logs/audit.jsonl
  max_field_chars: 2000
  max_bytes: 5000000
  max_files: 100
  include_outputs: true

policy:
  path: policy.yaml
  subject: assistant

vault:
  # Memory is stored in ordinary Markdown files. Create this directory
  # before starting Hagar; if it is missing, memory is disabled.
  # Security warning: do NOT put this directory in the filesystem section!
  # Vault path MUST NOT be readable/writable from LLM
  path: ./vault

memory:
  enabled: true
  vault_subdir: Hagar
  context_turns: 10
  context_skills: 3
  context_project_memories: 10
  max_context_chars: 6000
  project_max_active: 200
  summary_max_chars: 4000
  max_skill_chars: 4000

hifi:
  # Pre-pass di disambiguazione: una chiamata extra prima della risposta.
  enabled: false
  # Se la probabilità più alta supera la seconda di oltre questo margine
  # (in punti percentuali), Hagar risponde; altrimenti chiede chiarimento.
  margin: 0.20
  interpretations: 3

tools:
  # Timeout per singola tool call; 0 disabilita il limite.
  timeout: 120
  # Blocca la terza chiamata identica nello stesso turno; 0 disabilita.
  repeat_limit: 3

dev:
  # Le ricette sono configurazione fidata per test, debug e build.
  # Richiede anche la capability DEV_EXEC in policy.yaml.
  enabled: false
  recipes: recipes.yaml
  copy_workspace: true
  max_output_chars: 100000

boxes:
  # Trasformazioni LLM bounded: summarize, translate, extract_json.
  # Richiede BOX_EXEC in policy.yaml.
  enabled: false
  max_input_chars: 200000
  max_output_chars: 20000
  chunk_chars: 8000
  max_calls: 20

flow:
  # DSL Hagar Flow: sottoinsieme lineare di Python.
  # Richiede FLOW_EXEC in policy.yaml.
  enabled: false
  max_source_chars: 20000
  max_steps: 10000
  max_tool_calls: 50
  max_loop_iterations: 1000
  timeout: 120
  max_output_chars: 20000

filesystem:
  # Host paths, exposed to the model as /home/ai/<alias>.
  # Permissions: R = read/list/search/stat, W = write/create/rename/
  # copy/delete, X = chdir/execute (when exec() function will exist).
  sandbox:
    - alias: workspace
      path: .
      permissions: RX
  limits:
    # 0 disables the limit. Byte counters are per session.
    max_write_bytes: 0
    min_free_bytes: 0
    session_write_bytes: 0
    ask_over_bytes: 0

permissions:
  read: true
  write: false
  shell: false
  network: false

rag:
  top_k: 8

