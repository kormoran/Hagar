model:
  # provider: ollama | deepseek | claude | gemini
  provider: ollama
  # host: base URL del provider (default per provider)
  host: http://localhost:11434
  name: llama3.1:latest
  # native_tools: false per usare il protocollo JSON testuale
  native_tools: true
  # max_tokens: 1024
  # api_key_env: DEEPSEEK_API_KEY

audit:
  enabled: true
  path: logs/audit.jsonl
  max_field_chars: 2000
  max_bytes: 5000000
  max_files: 100
  include_outputs: true

policy:
  path: policy.yaml
  subject: assistant

vault:
  # Vault Obsidian separato dalla sandbox operativa.
  path: ~/HagarVault

memory:
  enabled: true
  vault_subdir: Hagar
  context_turns: 10
  context_skills: 3
  max_skill_chars: 4000

filesystem:
  allowed:
    # Radice fisica; l'agente la vede come /home/ai.
    - ~/ai

permissions:
  read: true
  write: true
  shell: false
  network: true

rag:
  top_k: 8

