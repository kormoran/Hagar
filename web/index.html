<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hagar</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<aside>
  <h1>Hagar</h1>
  <div class="muted" id="model">...</div>
  <h2>Sessione</h2>
  <dl>
    <dt>Progetto</dt><dd id="project">...</dd>
    <dt>Memoria</dt><dd id="memory">...</dd>
    <dt>Audit</dt><dd id="audit">...</dd>
  </dl>
  <h2>Amministrazione</h2>
  <div class="row">
    <a class="button-link" href="/control">Pannello</a>
    <a class="button-link" href="/sandbox">Sandbox</a>
  </div>
  <h2>Progetti</h2>
  <div class="row">
    <button id="project-refresh">Aggiorna</button>
    <button id="project-free">Libera</button>
    <button id="project-new">Nuovo</button>
  </div>
  <div id="projects" class="muted"></div>
  <h2>Tool</h2>
  <div id="tools"></div>
  <div id="usage">
    <div>Token sessione</div>
    <strong id="usage-total">0</strong>
    <div id="usage-detail" class="muted">in 0 · out 0</div>
  </div>
</aside>
<main>
  <nav class="tabs">
    <button class="tab active" data-tab="chat">Chat</button>
    <button class="tab" data-tab="history">Chat history</button>
    <button class="tab" data-tab="tools">Tool output</button>
    <button class="tab" id="audit-tab" data-tab="audit">Audit</button>
    <button class="tab" data-tab="thinking">Thinking</button>
    <button class="tab" data-tab="memories">Memories</button>
  </nav>

  <section id="panel-chat" class="panel active">
    <header>
      <strong>Chat</strong>
      <div class="row">
        <a class="button-link" href="/control">Pannello</a>
        <a class="button-link" href="/sandbox">Sandbox</a>
        <span class="muted" id="state">pronta</span>
        <button id="stop" disabled>Stop</button>
      </div>
    </header>
    <div id="messages"></div>
    <div id="previews"></div>
    <form id="composer">
      <textarea id="input" placeholder="Scrivi un messaggio..." autofocus></textarea>
      <label class="file-button">
        Immagine
        <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
      </label>
      <button class="primary" id="send" type="submit">Invia</button>
    </form>
  </section>

  <section id="panel-history" class="panel">
    <div class="panel-head">
      <strong>Chat history</strong>
      <button id="new-chat" class="primary">+ Nuova chat</button>
    </div>
    <div id="history" class="history"></div>
  </section>

  <section id="panel-tools" class="panel">
    <div class="panel-head"><strong>Tool output</strong></div>
    <div id="tool-log" class="log"></div>
  </section>

  <section id="panel-audit" class="panel">
    <div class="panel-head"><strong>Audit</strong></div>
    <div id="audit-off" class="empty" hidden>audit off</div>
    <div id="audit-log" class="log"></div>
  </section>

  <section id="panel-thinking" class="panel">
    <div class="panel-head"><strong>Thinking</strong></div>
    <div id="thinking-log" class="log"></div>
  </section>

  <section id="panel-memories" class="panel">
    <div class="panel-head">
      <strong>Memories</strong>
      <input id="memory-search" type="search" placeholder="Cerca nelle memorie..." autocomplete="off">
    </div>
    <div class="memory-layout">
      <div id="memory-list" class="memory-list"></div>
      <pre id="memory-content" class="memory-content">Seleziona una memoria.</pre>
    </div>
  </section>
</main>
<div id="modal" role="dialog" aria-modal="true">
  <div class="box">
    <h3 id="confirm-title">Conferma richiesta</h3>
    <p class="muted" id="confirm-reason"></p>
    <dl>
      <dt>Agente</dt><dd id="confirm-agent">main</dd>
      <dt>Tool</dt><dd id="confirm-tool"></dd>
      <dt>Capability</dt><dd id="confirm-capabilities"></dd>
    </dl>
    <pre id="confirm-arguments"></pre>
    <div class="row" style="justify-content:flex-end">
      <button id="confirm-deny">Rifiuta</button>
      <button class="primary" id="confirm-allow">Consenti</button>
    </div>
  </div>
</div>
<script>const TOKEN = __HAGAR_TOKEN__;</script>
<script src="/static/app.js"></script>
</body>
</html>
