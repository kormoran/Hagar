[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hagar"
version = "0.7.0"
description = "Harness agentico generale per AI resilienti"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Massimo Soricetti" },
]
keywords = [
    "llm",
    "agent",
    "harness",
    "mcp",
    "ollama",
    "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "feedparser>=6",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "build>=1.2",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/kormoran/Hagar"
Repository = "https://github.com/kormoran/Hagar"
Issues = "https://github.com/kormoran/Hagar/issues"
Changelog = "https://github.com/kormoran/Hagar/blob/main/Docs/it/CHANGELOG.md"

[project.scripts]
hagar = "hagar:main"

[tool.setuptools]
py-modules = ["hagar"]
packages = ["core", "llm", "memory", "local_tools", "web"]

[tool.setuptools.package-data]
web = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v"
markers = [
    "live: test che chiamano servizi esterni reali (eseguire con --live)",
]
