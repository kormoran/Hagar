[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hagar"
version = "0.2.0"
description = "Harness agentico generale per AI resilienti"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hagar = "hagar:main"

[tool.setuptools]
py-modules = ["hagar"]
packages = ["core", "llm", "memory", "MCP_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v"
markers = [
    "live: test che chiamano servizi esterni reali (eseguire con --live)",
]
